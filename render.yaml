# Render.com Blueprint — one deployable service for the test phase.
# Deploys the FastAPI renderer (which also hosts the Claude /agent endpoint)
# from this public repo. No CLI, no local Docker: New + → Blueprint → pick this
# repo. Set ANTHROPIC_API_KEY in the dashboard when prompted (sync: false).
#
# The documented production architecture keeps rendering (Python) and
# orchestration (Supabase edge, Deno) separate; this single service is the
# low-friction test target and is easy to split later.
services:
  - type: web
    name: ow-renderer
    runtime: docker
    rootDir: renderer
    dockerfilePath: ./Dockerfile
    region: frankfurt          # EU; matches the eu-central-1 preference
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"                # test phase: allow any origin; tighten for prod
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8            # strong model — used only on repair/escalation
      - key: ANTHROPIC_MODEL_FAST
        value: claude-haiku-4-5-20251001  # fast model — the happy path (edits, per-slide)
      - key: ANTHROPIC_API_KEY
        sync: false            # set in the Render dashboard, never committed
